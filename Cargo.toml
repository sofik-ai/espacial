[workspace]
resolver = "3"
members = [
    "apps/espacial-desktop",
    "apps/espacial-server",
    "crates/espacial-application",
    "crates/espacial-domain",
    "crates/espacial-infrastructure",
    "crates/espacial-protocol",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
repository = "https://github.com/sofik-ai/espacial"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.16", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
